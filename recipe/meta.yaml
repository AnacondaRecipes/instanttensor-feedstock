{% set name = "instanttensor" %}
{% set version = "0.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d9a986b98d6d4c95102bc8471733cbe9be1e4bb425b7c8be2b16948f116bcb65

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - setuptools >=65.0
    - wheel
  host:
    - python
    - pip
    #- setuptools >=65.0
    #- wheel
    - pytorch {{ pytorch }}
  run:
    - python
    - pytorch >=2.8.0

test:
  imports:
    - instanttensor
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/scitix/InstantTensor
  summary: An ultra-fast, distributed Safetensors loader
  description: |
    InstantTensor is an ultra-fast, distributed Safetensors loader designed to maximize I/O throughput when moving model
    weights from Safetensors files to GPU memory.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  dev_url: https://github.com/scitix/InstantTensor
  doc_url: https://github.com/scitix/InstantTensor

extra:
  recipe-maintainers:
    - Jrice1317
